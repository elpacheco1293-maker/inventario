<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Nexocorp · Control de Inventario</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f1effa;--card:#fff;--ink:#150a2e;--mut:#5f5a7a;--navy:#110422;--navy2:#2a1670;--gold:#5b48f5;--ok:#1b7f4b;--bad:#b3261e;--line:#dcd8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0319;--card:#1a0d33;--ink:#ece8fb;--mut:#a59fc4;--line:#322356;--gold:#8b7bff;--navy2:#3b25a8;--ok:#3ccf86;--bad:#ff7a70}}
:root[data-theme="dark"]{--bg:#0d0319;--card:#1a0d33;--ink:#ece8fb;--mut:#a59fc4;--line:#322356;--gold:#8b7bff;--navy2:#3b25a8;--ok:#3ccf86;--bad:#ff7a70}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:radial-gradient(circle at 12% 0,#2a1670,var(--navy) 60%);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--gold)}
header h1{font-size:17px;margin:0;letter-spacing:.14em;text-transform:uppercase;flex:1}
header small{color:var(--gold);letter-spacing:.1em}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(11,37,69,.07)}
h2{margin:0 0 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 5px}
button{font:inherit;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;border:0;border-radius:4px;padding:11px 20px;cursor:pointer;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
.login{max-width:400px;margin:6vh auto}.lg{display:block;margin:0 auto 18px;height:90px;filter:drop-shadow(0 0 18px #5b48f588)}.login .card{border-top:4px solid var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:6px;padding:14px 16px}
.kpi b{display:block;font-size:30px;line-height:1.1}.kpi span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--gold));transition:width .4s}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:9px 10px;border-bottom:2px solid var(--navy)}
td{padding:8px 10px;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.05em}
.t-ok{background:rgba(27,127,75,.15);color:var(--ok)}.t-p{background:rgba(91,72,245,.15);color:#4a36c9}.t-w{background:rgba(179,38,30,.13);color:var(--bad)}
@media (prefers-color-scheme:dark){.t-p{color:#a99dff}}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:3px solid transparent}.tabs button.on{border-bottom-color:var(--gold);background:var(--navy);color:#fff}
.banner{padding:18px 20px;border-radius:6px;border-left:6px solid var(--ok);background:rgba(27,127,75,.12);margin-bottom:18px}
.banner b{font-size:18px;display:block;color:var(--ok)}
td input{max-width:130px;text-align:right}.msg{color:var(--bad);min-height:20px;margin-top:8px}.ok{color:var(--ok)}
.diff-neg{color:var(--bad);font-weight:700}.diff-pos{color:#7a5af8;font-weight:700}
</style></head><body>

const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bid=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9_-]/g,"");
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const fmt=d=>d?new Date(d).toLocaleString("es-BO",{dateStyle:"medium",timeStyle:"short"}):"—";
const ordn=(a,b)=>a.localeCompare(b,"es",{numeric:true});
const sb=supabase.createClient(SB_URL,SB_KEY);
let me=null,bd=null,tab="dash",resumen=[],detB="",detQ="",parsed=null,timer=null;
const m=(t,ok)=>{const e=$("#m");if(e){e.className="msg"+(ok?" ok":"");e.innerHTML=t}};
function topbar(l){$("#who").textContent=l||"";$("#out").style.display=l?"":"none"}
$("#out").onclick=async()=>{await sb.auth.signOut();me=null;bd=null;login()};

function login(){
  topbar("");
  app.innerHTML=`<div class="login"><img class="lg" src="${LOGO}" alt="Nexocorp"><div class="card"><h2>Acceso</h2>
  <label>Usuario (bodega) o correo (administrador)</label><input id="u" autocapitalize="characters" autocomplete="off" placeholder="Ej. B301">
  <label>Contraseña</label><input id="p" type="password" placeholder="••••••">
  <div class="msg" id="m"></div><button id="go" style="width:100%;margin-top:6px">Ingresar</button></div></div>`;
  $("#go").onclick=doLogin;$("#p").onkeydown=e=>{if(e.key==="Enter")doLogin()};
}
async function doLogin(){
  const u=$("#u").value.trim(),p=$("#p").value;if(!u||!p)return m("Ingresa usuario y contraseña.");
  $("#go").disabled=true;
  if(u.includes("@")){const{error}=await sb.auth.signInWithPassword({email:u,password:p});
    if(error){$("#go").disabled=false;return m("Correo o contraseña incorrectos.")}return admin()}
  const{data,error}=await sb.rpc("bodega_login",{p_id:u,p_clave:p});
  if(error){$("#go").disabled=false;return m("Usuario o contraseña incorrectos.")}
  me={id:bid(u),clave:p};bd=data;bodega();
}

/* ---------- BODEGA ---------- */
function bodega(){
  topbar("Bodega "+bd.id);const d=bd,it=d.items;
  let h=`<div class="card" style="display:flex;gap:16px;align-items:center">${d.logo_url?`<img src="${esc(d.logo_url)}" style="height:56px;max-width:140px;object-fit:contain" alt="">`:""}<div><h2 style="margin:0 0 4px">${esc(d.nombre||"Bodega "+d.id)}</h2><span style="color:var(--mut)">${esc(d.direccion||"")}</span></div></div>`;
  if(d.done)h+=`<div class="banner"><b>✔ Inventario ya ingresado</b>La bodega ${esc(d.id)} registró su inventario el ${fmt(d.done_at)}. Ya no es posible modificarlo.</div>`;
  else h+=`<div class="card"><div class="row"><div class="grow"><h2 style="margin:0" id="prog"></h2></div><button id="se">Guardar</button></div><div class="bar" style="margin-top:12px"><i id="pb"></i></div><div class="msg" id="m"></div></div>`;
  h+=`<div class="card"><div class="tw"><table><tr><th>Código</th><th>Descripción</th><th class="n">Sistema</th><th class="n">Físico</th></tr>`;
  it.forEach(r=>{h+=`<tr><td><b>${esc(r.codigo)}</b></td><td>${esc(r.descripcion)}</td><td class="n">${r.sistema}</td><td class="n">${d.done?(r.fisico??"—"):`<input data-id="${r.id}" inputmode="decimal" placeholder="Físico">`}</td></tr>`});
  app.innerHTML=h+`</table></div></div>`;
  if(d.done)return;
  const upd=()=>{const f=[...document.querySelectorAll("input[data-id]")].filter(i=>num(i.value)!=null).length;$("#prog").textContent=`Bodega ${d.id} · ${f} de ${it.length} ítems contados`;$("#pb").style.width=(it.length?f/it.length*100:0)+"%"};
  document.querySelectorAll("input[data-id]").forEach(i=>i.oninput=upd);upd();$("#se").onclick=guardar;
}
async function guardar(){
  const vals=[...document.querySelectorAll("input[data-id]")].map(i=>({id:+i.dataset.id,fisico:num(i.value)}));
  if(vals.some(v=>v.fisico==null))return m("Faltan ítems por contar. Completa todos los campos (usa 0 si no hay stock).");
  $("#se").disabled=true;
  const{error}=await sb.rpc("bodega_guardar",{p_id:me.id,p_clave:me.clave,p_vals:vals});
  if(error){$("#se").disabled=false;return m("No se pudo guardar: "+esc(error.message))}
  me=null;bd=null;topbar("");
  app.innerHTML=`<div class="login"><div class="card" style="text-align:center;border-top:4px solid var(--ok)"><h2 style="color:var(--ok);font-size:20px">✔ Registro exitoso</h2><p>Tu inventario fue guardado. Volviendo al inicio…</p></div></div>`;
  setTimeout(login,2500);
}

/* ---------- ADMIN ---------- */
async function admin(){
  topbar("Administrador");
  const{data,error}=await sb.rpc("admin_resumen");resumen=(data||[]).sort((a,b)=>ordn(a.id,b.id));
  const done=resumen.filter(x=>x.done).length,tot=resumen.length,pct=tot?Math.round(done/tot*100):0;
  let h=`<div class="tabs">${[["dash","Dashboard"],["det","Detalle"],["load","Cargar datos"]].map(([k,t])=>`<button data-t="${k}" class="${tab===k?"on":""}">${t}</button>`).join("")}</div>`;
  if(error)h+=`<div class="card msg">No se pudo leer la base de datos: ${esc(error.message)}</div>`;
  if(tab==="dash"){
    h+=`<div class="kpis"><div class="kpi"><b>${tot}</b><span>Bodegas</span></div><div class="kpi"><b style="color:var(--ok)">${done}</b><span>Respondidas</span></div><div class="kpi"><b style="color:var(--bad)">${tot-done}</b><span>Pendientes</span></div><div class="kpi"><b>${pct}%</b><span>Avance</span></div></div><div class="card"><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="card"><div class="row"><h2 class="grow">Estado por bodega</h2><button class="sec" id="exp">Exportar CSV</button></div><div class="tw"><table><tr><th>Bodega</th><th>Estado</th><th class="n">Ítems</th><th class="n">Contados</th><th class="n">Dif. neta</th><th>Enviado</th></tr>`;
    if(!tot)h+=`<tr><td colspan="6">Aún no hay datos. Ve a “Cargar datos”.</td></tr>`;
    resumen.forEach(r=>{const tag=r.done?'<span class="tag t-ok">Completado</span>':'<span class="tag t-w">Pendiente</span>';const df=+r.dif;
      h+=`<tr><td><b>${esc(r.id)}</b></td><td>${tag}</td><td class="n">${r.n}</td><td class="n">${r.contados}</td><td class="n ${df<0?"diff-neg":df>0?"diff-pos":""}">${r.contados>0?df:"—"}</td><td>${r.done?fmt(r.done_at):"—"}</td></tr>`});
    h+=`</table></div></div>`;
  }else if(tab==="det"){
    h+=`<div class="card"><div class="row"><h2 class="grow">Detalle del documento</h2><select id="fb" style="width:auto"><option value="">Todas las bodegas</option>${resumen.map(r=>`<option ${r.id===detB?"selected":""}>${esc(r.id)}</option>`).join("")}</select><input id="fq" placeholder="Buscar código o descripción" value="${esc(detQ)}" style="width:240px"></div><div class="tw" style="max-height:65vh;overflow:auto"><table><tr><th>Bodega</th><th>Código</th><th>Descripción</th><th class="n">Sistema</th><th class="n">Físico</th><th class="n">Dif.</th></tr><tbody id="dtb"><tr><td colspan="6">Cargando…</td></tr></tbody></table></div></div>`;
  }else h+=`<div class="card"><h2>Cargar inventario</h2><p style="margin:0 0 10px;color:var(--mut)">Columnas con encabezado: <b>codigo, descripcion, sistema, bodega</b> (en cualquier orden). Opcional: <b>clave</b> para dar una contraseña distinta a cada bodega (si no, la contraseña es el nombre de la bodega). Al cargar, las bodegas incluidas se reinician.</p>
    <input type="file" id="f" accept=".xlsx,.xls,.csv"><label>O pega aquí</label><textarea id="t" rows="7"></textarea>
    <div class="row" style="margin-top:12px"><button id="pv">Validar datos</button><button id="sv" disabled>Guardar y crear bodegas</button></div><div class="msg" id="m"></div><div id="pre"></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;admin()});
  if($("#exp"))$("#exp").onclick=exportCsv;
  if(tab==="det"){loadDet();$("#fb").onchange=e=>{detB=e.target.value;loadDet()};$("#fq").oninput=e=>{detQ=e.target.value;clearTimeout(timer);timer=setTimeout(loadDet,300)}}
  if(tab==="load")loadUI();
}
async function loadDet(){
  let q=sb.from("items").select("bodega_id,codigo,descripcion,sistema,fisico").order("bodega_id").order("id").limit(500);
  if(detB)q=q.eq("bodega_id",detB);const s=detQ.replace(/[,()%*]/g,"").trim();if(s)q=q.or(`codigo.ilike.%${s}%,descripcion.ilike.%${s}%`);
  const{data,error}=await q;const t=$("#dtb");if(!t)return;
  if(error)return t.innerHTML=`<tr><td colspan="6">${esc(error.message)}</td></tr>`;
  t.innerHTML=(data||[]).map(r=>{const df=r.fisico==null?"":r.fisico-r.sistema;return`<tr><td>${esc(r.bodega_id)}</td><td>${esc(r.codigo)}</td><td>${esc(r.descripcion)}</td><td class="n">${r.sistema}</td><td class="n">${r.fisico??"—"}</td><td class="n ${df<0?"diff-neg":df>0?"diff-pos":""}">${df===""?"—":df}</td></tr>`}).join("")||`<tr><td colspan="6">Sin resultados.</td></tr>`;
  if((data||[]).length>=500)t.innerHTML+=`<tr><td colspan="6">Mostrando 500 filas; usa el filtro para ver más.</td></tr>`;
}
async function exportCsv(){
  let rows=[],from=0;for(;;){const{data}=await sb.from("items").select("bodega_id,codigo,descripcion,sistema,fisico").order("id").range(from,from+999);if(!data||!data.length)break;rows=rows.concat(data);if(data.length<1000)break;from+=1000}
  const st=Object.fromEntries(resumen.map(r=>[r.id,r.done]));
  let c="Bodega,Codigo,Descripcion,Sistema,Fisico,Diferencia,Estado\n";
  rows.forEach(r=>{c+=[r.bodega_id,r.codigo,'"'+String(r.descripcion||"").replace(/"/g,'""')+'"',r.sistema,r.fisico??"",r.fisico==null?"":r.fisico-r.sistema,st[r.bodega_id]?"Completado":"Pendiente"].join(",")+"\n"});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download="inventario.csv";a.click();
}
function parseRows(matrix){
  let mx=matrix.filter(r=>r.some(c=>String(c??"").trim()!==""));
  const nm=x=>String(x??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f\s]/g,"");
  let ib=0,ic=1,id=2,is=3,ik=-1;
  if(mx.length){const h=mx[0].map(nm);if(h.some(x=>/^(bodega|sistema|codigo)/.test(x))){
    const f=(re,d)=>{const i=h.findIndex(x=>re.test(x));return i<0?d:i};
    ib=f(/^bodega/,ib);ic=f(/^cod/,ic);id=f(/^desc/,id);is=f(/^(sistema|stock|saldo)/,is);ik=f(/^(clave|password|contrasena)/,-1);mx=mx.slice(1)}}
  const g={},cl={},bad=[];
  mx.forEach((r,k)=>{const b=bid(r[ib]),c=String(r[ic]??"").trim(),s=num(r[is]);
    if(!b||!c||s==null){bad.push(k+2);return}
    (g[b]=g[b]||[]).push([c,String(r[id]??"").trim(),s]);if(ik>=0&&String(r[ik]??"").trim())cl[b]=String(r[ik]).trim()});
  return{g,cl,bad};
}
function loadUI(){
  const run=mx=>{parsed=parseRows(mx);const ids=Object.keys(parsed.g).sort(ordn),n=ids.reduce((a,i)=>a+parsed.g[i].length,0);
    if(!n){m("No se reconocieron filas válidas.");$("#sv").disabled=true;return}
    m(`<span class="ok">${n} ítems en ${ids.length} bodegas reconocidos.</span>${parsed.bad.length?` Filas omitidas: ${parsed.bad.slice(0,15).join(", ")}.`:""}`);
    let k=0,rw="";for(const i of ids)for(const r of parsed.g[i]){if(k++>=300)break;rw+=`<tr><td>${esc(i)}</td><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="n">${r[2]}</td></tr>`}
    $("#pre").innerHTML=`<p style="color:var(--mut)">${ids.map(i=>esc(i)+": "+parsed.g[i].length).join(" · ")}</p><div class="tw" style="max-height:50vh;overflow:auto"><table><tr><th>Bodega</th><th>Código</th><th>Descripción</th><th class="n">Sistema</th></tr>${rw}</table></div>${n>300?`<p style="color:var(--mut)">Vista previa de 300 de ${n} filas.</p>`:""}`;
    $("#sv").disabled=false};
  $("#pv").onclick=()=>run($("#t").value.split(/\r?\n/).map(l=>l.split(l.includes("\t")?"\t":l.includes(";")?";":",")));
  $("#f").onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});run(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true}))}catch(x){m("No se pudo leer el archivo.")}};
  $("#sv").onclick=async()=>{$("#sv").disabled=true;m("Guardando…");
    try{let batch=[];const flush=async()=>{if(!batch.length)return;const{error}=await sb.rpc("admin_cargar",{p_rows:batch});if(error)throw error;batch=[]};
      for(const b of Object.keys(parsed.g)){parsed.g[b].forEach(r=>batch.push({bodega:b,codigo:r[0],descripcion:r[1],sistema:r[2],clave:parsed.cl[b]||null}));if(batch.length>3000)await flush()}
      await flush();tab="det";detB="";admin()}catch(x){m("Error al guardar: "+esc(x.message||x.code));$("#sv").disabled=false}};
}

(async()=>{
  if(SB_URL.startsWith("PEGA_")){app.innerHTML=`<div class="card msg">Falta configurar SB_URL y SB_KEY en index.html (ver README).</div>`;return}
  const{data}=await sb.auth.getSession();if(data.session)admin();else login();
})();
</script></body></html>
